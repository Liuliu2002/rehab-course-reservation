worker_processes 1;

error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include D:/develop/back/TakeOut/nginx-1.20.2/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        # 使用 8090，避免和 TakeOut 项目的 80 端口冲突。
        listen 8090;
        server_name localhost;

        # 直接读取当前项目中的静态前端，无需复制 html 文件。
        location / {
            root D:/develop/back/rehab-course-reservation/rehab-front;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # REST 请求转发给 IDEA 中运行的 Spring Boot 服务。
        location /student/ {
            proxy_pass http://127.0.0.1:8080/student/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin/ {
            proxy_pass http://127.0.0.1:8080/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket 升级头必须透传，否则教师端无法建立实时通知通道。
        location /ws/appointment {
            proxy_pass http://127.0.0.1:8080/ws/appointment;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
